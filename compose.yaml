name: myhomebudget

x-backend-env: &backend-env
  POSTGRES_DB: ${POSTGRES_DB:?Run scripts/configure.ps1 first}
  POSTGRES_USER: ${POSTGRES_USER:?Run scripts/configure.ps1 first}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.ps1 first}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run scripts/configure.ps1 first}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/configure.ps1 first}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/configure.ps1 first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.ps1 first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
    logging: *default-logging
    restart: unless-stopped

  migrate:
    build: ./backend
    image: myhomebudget-backend:local
    command: ["python", "manage.py", "migrate_locked"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    restart: "no"

  backend:
    build: ./backend
    image: myhomebudget-backend:local
    environment: *backend-env
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  proxy:
    image: caddy:2.10.0-alpine
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
